    <!-- Window.fetch protection for browser sandbox / polyfills -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var fetchHolder = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return fetchHolder || originalFetch;
            },
            set: function(fn) {
              fetchHolder = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if cannot be redefined
        }
      })();
    </script>
